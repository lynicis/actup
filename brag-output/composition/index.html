<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>actup — A version manager for GitHub Actions</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0b0f17;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0b0f17;
      }
      .clip {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="root"
      data-start="0"
      data-duration="21"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg-layer" class="clip" data-composition-id="bg-stage" data-composition-src="compositions/bg-stage.html" data-start="0" data-duration="21" data-track-index="0" style="z-index: 1;"></div>
      <div id="comp-s1" class="clip" data-composition-id="scene-1" data-composition-src="compositions/scene-1.html" data-start="0" data-duration="3.8" data-track-index="1" style="z-index: 10;"></div>
      <div id="comp-s2" class="clip" data-composition-id="scene-2" data-composition-src="compositions/scene-2.html" data-start="3.8" data-duration="4.9" data-track-index="2" style="z-index: 20;"></div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["root"] = tl;
      tl.seek(0);
