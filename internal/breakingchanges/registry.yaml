- action: "actions/checkout"
  from_major: 2
  to_major: 3
  changes:
    - type: behavior
      message: "checkout v3 runs on Node 16; self-hosted runners must support Node 16."

- action: "actions/checkout"
  from_major: 3
  to_major: 4
  changes:
    - type: behavior
      message: "checkout v4 runs on Node 20; self-hosted runners must be v2.308.0 or newer."

- action: "actions/upload-artifact"
  from_major: 3
  to_major: 4
  changes:
    - type: behavior
      message: "upload-artifact v4 runs on Node 20; self-hosted runners must be v2.308.0 or newer."
    - type: behavior
      message: "upload-artifact v4 artifact names are immutable, and hidden files are excluded by default."

- action: "actions/download-artifact"
  from_major: 3
  to_major: 4
  changes:
    - type: behavior
      message: "download-artifact v4 runs on Node 20; self-hosted runners must be v2.308.0 or newer."
    - type: behavior
      message: "download-artifact v4 makes the name input optional; omitting it downloads all artifacts into per-artifact directories."

- action: "actions/cache"
  from_major: 3
  to_major: 4
  changes:
    - type: behavior
      message: "cache v4 runs on Node 20; self-hosted runners must be v2.308.0 or newer."
    - type: behavior
      message: "cache v4 requires the cache service v2 backend."

- action: "actions/setup-node"
  from_major: 3
